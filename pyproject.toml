[project]
name = "axiom-pilot-ryan-vo"
version = "1.0.0"
description = "AI/ML developer tool for Cursor plugin quality analysis"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Ryan Vo", email = "ryandtvo@gmail.com"}
]
maintainers = [
    {name = "Ryan Vo", email = "ryandtvo@gmail.com"}
]
keywords = ["ai", "ml", "cursor", "plugin", "validation", "quality", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "sqlalchemy[asyncio]==2.0.36",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.12",
    "httpx==0.27.2",
    "aiosqlite==0.20.0",
    "python-dotenv==1.0.1",
    "authlib==1.3.1",
    "itsdangerous==2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.23.7",
    "pytest-httpx==0.27.0",
    "ruff==0.5.7",
    "mypy==1.10.0",
]

[project.urls]
Homepage = "https://github.com/A220man/axiom-pilot-ryan-vo"
Repository = "https://github.com/A220man/axiom-pilot-ryan-vo"
Issues = "https://github.com/A220man/axiom-pilot-ryan-vo/issues"

[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "UP", "B", "C4", "PTH", "T20", "W"]
ignore = ["E501", "TRY003"]
fixable = ["F", "I", "UP", "B", "C4", "PTH", "T20", "W"]
unsafe-fixes = []

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"