name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Run backend tests
        run: |
          PYTHONPATH=. .venv/bin/python -m pytest tests/ -v --tb=short
        env:
          SECRET_KEY: "test-secret-key-for-ci-only-not-for-production-use"
          OIDC_CLIENT_SECRET: "test-client-secret"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          ENVIRONMENT: "development"
          DEBUG: "true"
          OIDC_ENABLED: "true"
          OIDC_ISSUER_URL: "http://localhost:8080/realms/axiom-pilot"
          OIDC_REDIRECT_URI: "http://localhost:8000/auth/callback"
          FRONTEND_URL: "http://localhost:5173"

  frontend-test:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run build 2>&1 | head -50

      - name: Run tests
        run: npm test

  backend-docker:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: axiom-pilot-backend:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend-docker:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest
    needs: frontend-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: axiom-pilot-frontend:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  validate:
    name: Validate Required Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run preflight check
        run: |
          python3 /opt/alan-portfolio/skills/github/scripts/preflight.py . --account ryan