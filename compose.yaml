# Docker Compose for local development and testing
# Usage: docker compose up --build
# For demo mode: docker compose --profile demo up --build

services:
  # PostgreSQL for production-like persistence (optional, SQLite default)
  postgres:
    image: postgres:16-alpine
    container_name: axiom-pilot-db
    environment:
      POSTGRES_DB: axiom_pilot
      POSTGRES_USER: axiom_pilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axiom_pilot -d axiom_pilot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - axiom-pilot-network
    profiles:
      - postgres

  # Keycloak for OIDC authentication
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: axiom-pilot-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-changeme}
      KC_DB: dev-file
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - axiom-pilot-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: axiom-pilot-backend
    environment:
      - APP_NAME=axiom-pilot-ryan-vo
      - APP_VERSION=1.0.0
      - ENVIRONMENT=development
      - DEBUG=true
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite+aiosqlite:///./data/app.db
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - SESSION_COOKIE_SECURE=false
      - OIDC_ENABLED=true
      - OIDC_ISSUER_URL=http://keycloak:8080/realms/axiom-pilot
      - OIDC_CLIENT_ID=axiom-pilot
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-dev-client-secret}
      - OIDC_REDIRECT_URI=http://127.0.0.1:8000/auth/callback
      - OIDC_LOGOUT_URI=http://keycloak:8080/realms/axiom-pilot/protocol/openid-connect/logout
      - FRONTEND_URL=http://127.0.0.1:5173
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai-compatible}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - DEMO_MODE=false
    volumes:
      - backend_data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://127.0.0.1:8000/healthz', timeout=3).raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - axiom-pilot-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: axiom-pilot-frontend
    environment:
      - VITE_API_URL=http://127.0.0.1:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - axiom-pilot-network

volumes:
  postgres_data:
  keycloak_data:
  backend_data:

networks:
  axiom-pilot-network:
    driver: bridge